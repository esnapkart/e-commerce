<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - eSnapkart</title>
    <style>
        /* Reset default margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Center everything on the screen */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
        }

        /* Style for "Hello World" */
        .hello-text {
            font-size: 4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px; /* Space between Hello World and eSnapkart */
        }

        /* Style for "eSnapkart" */
        .brand-text {
            font-size: 2rem;
            font-weight: 800;
            color: #0a1cb4; /* Snapkart Blue */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Main Text -->
    <div class="hello-text">Hello World</div>
    
    <!-- Downside Text -->
    <div class="brand-text">eSnapkart</div>

</body>
</html>
